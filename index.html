<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DIVINE'S APP</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #0d0d0d;
      color: white;
    }

    header {
      padding: 45px 20px;
      text-align: center;
      background: linear-gradient(135deg, #0d0d0d, #2b2110);
      border-bottom: 1px solid #5c4816;
    }

    .logo {
      color: #d4af37;
      font-size: 34px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    header p {
      margin-top: 12px;
      color: #dddddd;
    }

    .container {
      max-width: 750px;
      margin: auto;
      padding: 20px;
    }

    .hero {
      text-align: center;
      padding: 35px 15px;
    }

    .hero h1 {
      font-size: 30px;
      color: #d4af37;
      margin-bottom: 12px;
    }

    .hero p {
      color: #cccccc;
      line-height: 1.6;
    }

    .card {
      background: #181818;
      border: 1px solid #5c4816;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    .card h2 {
      color: #d4af37;
      margin-bottom: 12px;
    }

    .card p {
      color: #cccccc;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    button,
    .whatsapp {
      display: inline-block;
      border: none;
      padding: 13px 20px;
      border-radius: 10px;
      background: #d4af37;
      color: #111111;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    button:hover,
    .whatsapp:hover {
      opacity: 0.9;
    }

    .services {
      display: grid;
      gap: 10px;
      margin-top: 15px;
    }

    .service {
      background: #202020;
      padding: 15px;
      border-radius: 10px;
      color: #eeeeee;
    }

    .menu {
      margin-top: 20px;
    }

    .menu h2 {
      text-align: center;
      color: #d4af37;
      margin-bottom: 20px;
    }

    .produit {
      background: #202020;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .produit-info {
      flex: 1;
    }

    .produit strong {
      color: white;
      display: block;
      margin-bottom: 5px;
    }

    .prix {
      color: #d4af37;
      font-weight: bold;
    }

    .quantite {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quantite button {
      width: 35px;
      height: 35px;
      padding: 0;
      border-radius: 8px;
      font-size: 20px;
    }

    .nombre {
      min-width: 25px;
      text-align: center;
      font-weight: bold;
    }

    .panier {
      background: #111111;
      border: 1px solid #d4af37;
      border-radius: 15px;
      padding: 20px;
      margin-top: 25px;
    }

    .panier h3 {
      color: #d4af37;
      margin-bottom: 15px;
    }

    .total {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: bold;
      margin: 20px 0;
    }
