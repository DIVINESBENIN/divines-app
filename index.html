*{

margin:0;

font-family:Arial,sans-serif;

body{

.hero h1{
color:#d4af37;
font-size:30px;
margin-bottom:12px;
}

.hero p{
color:#bbb;
line-height:1.6;
}

.card{
background:#151515;

padding:22px;

}

.card p{

.service{

}

.whatsapp{

.categories button.active{
background:#d4af37;
color:#111;

}

.photo{

}

}

.item-name{

}

.price{

font-weight:bold;
white-space:nowrap;
}

.item-bottom{

align-items:center;
margin-top:14px;
}

align-items:center;

}
